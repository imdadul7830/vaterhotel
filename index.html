<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Ordering System</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <h1>Welcome to Our Food Ordering System</h1>
    </header>
    <main>
        <section id="menu">
            <h2>Menu</h2>
            <ul>
                <li>
                    <span>Pizza</span>
                    <button onclick="addToOrder('Pizza', 10)">Add to Order</button>
                </li>
                <li>
                    <span>Burger</span>
                    <button onclick="addToOrder('Burger', 5)">Add to Order</button>
                </li>
                <li>
                    <span>Pasta</span>
                    <button onclick="addToOrder('Pasta', 8)">Add to Order</button>
                </li>
            </ul>
        </section>
        <section id="order-summary">
            <h2>Your Order</h2>
            <ul id="order-list"></ul>
            <strong>Total: $<span id="total-price">0</span></strong>
            <button onclick="submitOrder()">Submit Order</button>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 Food Ordering System</p>
    </footer>
</body>
</html>
